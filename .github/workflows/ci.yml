name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  desktop:
    name: desktop (gpui)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/rdm-desktop
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tools/check-version.mjs
      - name: Check desktop crate
        working-directory: apps/rdm-desktop
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          cargo build --release
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: rdm-desktop-windows
          path: apps/rdm-desktop/target/release/rdm-desktop.exe
          if-no-files-found: error

  extension:
    name: extension (mv3)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/rdm-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 扩展无运行时依赖，直接跑纯逻辑单测；并重生成图标确保与提交一致。
      - run: node --test
      - run: node scripts/make-icons.mjs
