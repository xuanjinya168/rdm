name: Release

# 推送形如 v0.3.0 的 tag 时，在云端构建 Windows 可执行文件并发布 Release。
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: build & release (windows)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/rdm-desktop

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify version declarations
        run: node tools/check-version.mjs

      - name: Verify desktop application
        working-directory: apps/rdm-desktop
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          cargo build --release

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = "apps/rdm-desktop/target/release/rdm-desktop.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Release executable not found: $exe"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          "$hash  rdm-desktop.exe" | Set-Content -LiteralPath SHA256SUMS.txt -Encoding ascii

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            --title "RDM ${{ github.ref_name }}" `
            --notes "RDM ${{ github.ref_name }} 的 Windows 可执行文件。" `
            "apps/rdm-desktop/target/release/rdm-desktop.exe" `
            SHA256SUMS.txt
